version: '3'

output: interleaved

tasks:
  dev:
    cmds:
      - mprocs "task backend" "task frontend"

  frontend:
    cmds:
      - VITE_BACKEND_URL=http://127.0.0.1:${PASEO_SERVICE_BACKEND_PORT:-8000} pnpm dev --host 127.0.0.1 --port ${PASEO_PORT:-5173}

  backend:
    cmds:
      - WEB_ORIGIN=${PASEO_SERVICE_FRONTEND_URL:-http://localhost:5173} uv run uvicorn backend.app:app --host 127.0.0.1 --port ${PASEO_PORT:-8000} --reload
